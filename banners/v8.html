<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<title>ბანერი 8 · შვეიცარიული მოდერნიზმი</title>
<link rel="stylesheet" href="common.css">
<style>
  :root { --paper: #f1f0eb; --ink: #0d0f0d; --lime: #c3ec4f; --mute: #6b6f69; }
  .banner { background: var(--paper); color: var(--ink); }

  /* grid rules */
  .rule-h { left: 140px; width: 1320px; height: 1.5px; background: var(--ink); }
  .rule-v { top: 64px; width: 1.5px; height: 272px; background: rgba(13,15,13,.18); }
  .meta { font-size: 15px; font-weight: 600; letter-spacing: 2.4px; color: var(--ink); }
  .meta.num { font-family: 'Montserrat', sans-serif; font-weight: 700; letter-spacing: 3px; }

  .disc { left: 1084px; top: 22px; width: 356px; height: 356px; border-radius: 50%; background: var(--lime); }

  .h1 { left: 140px; top: 96px; font-size: 80px; line-height: .96; font-weight: 800; letter-spacing: -.5px; }
  .cta { left: 140px; top: 280px; display: inline-flex; align-items: center; gap: 16px;
    background: var(--ink); color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 1.4px;
    padding: 16px 22px 17px 24px; }
  .cta svg { width: 20px; height: 20px; }

  .big { left: 548px; top: 84px; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 226px;
    line-height: 1; letter-spacing: -13px; color: var(--ink); white-space: nowrap; }
  .upto { left: 560px; top: 296px; font-size: 22px; font-weight: 700; letter-spacing: 1.5px; }
  .upto i { font-style: normal; color: var(--mute); font-weight: 500; }

  .product { filter: drop-shadow(0 18px 18px rgba(20,30,10,.28)); }
</style>
</head>
<body>
<div class="banner">
  <div class="abs disc"></div>

  <div class="abs rule-h" style="top:62px"></div>
  <div class="abs rule-h" style="top:338px"></div>
  <div class="abs rule-v" style="left:520px"></div>

  <div class="abs meta" style="left:140px; top:34px">SUPERI.GE</div>
  <div class="abs meta" style="left:548px; top:34px">ᲢᲔᲥᲜᲘᲙᲐ / ᲐᲕᲔᲯᲘ / ᲡᲐᲮᲚᲘ</div>
  <div class="abs meta num" style="left:1410px; top:34px">N°1</div>
  <div class="abs meta" style="left:140px; top:350px">ᲧᲕᲔᲚᲐᲤᲔᲠᲘ ᲡᲐᲮᲚᲘᲡᲗᲕᲘᲡ ᲔᲠᲗ ᲡᲘᲕᲠᲪᲔᲨᲘ</div>
  <div class="abs meta num" style="left:1348px; top:350px">SALE ↘</div>

  <div class="abs big">-50%</div>
  <div class="abs upto">ᲛᲓᲔ <i>ᲤᲐᲡᲓᲐᲙᲚᲔᲑᲐ</i></div>

  <img class="product" src="assets/coffee2.png" style="left:1144px; top:92px;  height:240px;">
  <img class="product" src="assets/vacuum.png"  style="left:1306px; top:152px; height:184px;">

  <div class="abs h1">ᲤᲐᲡᲔᲑᲘ<br>ᲓᲐᲔᲪᲐ</div>
  <div class="abs cta">ᲜᲐᲮᲔ ᲨᲔᲗᲐᲕᲐᲖᲔᲑᲔᲑᲘ
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </div>
</div>
</body>
</html>
