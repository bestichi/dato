<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
:root{--w:1600px;--h:760px}
body{background:#E9EBEE;font-family:"NG";display:flex;gap:56px;padding:48px;align-items:flex-start}
.lab{font-size:22px;font-weight:700;color:#444;margin-bottom:14px}
.desk{width:1000px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.desk .cv{width:1000px;height:370px;background:url(COVER.png) center/cover no-repeat}
.desk .row{display:flex;align-items:flex-end;gap:22px;padding:0 32px 28px;margin-top:-60px}
.pp{border-radius:50%;border:5px solid #fff;background:url(PROFILE.png) center/cover;flex:none}
.desk .pp{width:170px;height:170px}
.nm{font-size:34px;font-weight:800;color:#111;font-family:"UNB";letter-spacing:-.02em}
.mt{font-size:19px;color:#666;margin-top:4px}
.phone{width:400px;background:#fff;border-radius:34px;overflow:hidden;border:10px solid #111;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.phone .cv{width:380px;height:214px;background:url(COVER.png) center/cover no-repeat}
.phone .pp{width:120px;height:120px;margin:-60px 0 0 16px}
.phone .nm{font-size:26px;padding:10px 18px 0}
.phone .mt{font-size:16px;padding:0 18px 22px}
.sk{height:16px;background:#EEF0F2;border-radius:8px;margin:0 18px 12px}
</style></head><body>
<div><div class="lab">💻 კომპიუტერი (დაახლოებით)</div><div class="desk"><div class="cv"></div><div class="row"><div class="pp"></div><div><div class="nm">Superi.ge</div><div class="mt">ონლაინ მაღაზია · ტექნიკა და ყველაფერი სახლისთვის</div></div></div></div></div>
<div><div class="lab">📱 მობილური (დაახლოებით)</div><div class="phone"><div class="cv"></div><div class="pp"></div><div class="nm">Superi.ge</div><div class="mt">ონლაინ მაღაზია</div><div class="sk"></div><div class="sk" style="width:60%"></div><div style="height:180px"></div></div></div>
</body></html>
