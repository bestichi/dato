<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
/* Light cover in the style of the superi.ge homepage banner. Native 960x540 (Facebook serves covers at 960px). */
:root{--g:#51A244;--k:#07090A;--gray:#828282}
body{background:#fff}
.prod{left:452px;top:62px}
.logo{left:42px;top:100px}
.h1{left:40px;top:144px;font-size:33px;font-weight:900;color:var(--k);letter-spacing:-.01em;line-height:1.1}
.sub{left:42px;top:192px;font-size:15px;font-weight:700;color:var(--gray)}
.rule{left:42px;top:222px;width:380px;height:2px;background:var(--k)}
.cats{left:42px;top:238px;font-size:15px;font-weight:500;color:var(--k);display:flex;gap:12px;align-items:center}
.cats i{width:6px;height:6px;border-radius:50%;background:var(--g);display:block}
.deal{left:42px;top:276px;display:flex;align-items:center;gap:16px}
.deal .w{font-size:19px;font-weight:800;color:var(--g)}
.deal .bar{width:2px;height:40px;background:var(--k);opacity:.8}
.deal .n{font-family:"UNB";font-weight:800;font-size:46px;color:var(--g);letter-spacing:-.02em;line-height:1}
.deal .m{font-size:17px;font-weight:700;color:var(--k);align-self:flex-end;margin-bottom:4px;margin-left:-8px}
.btn{left:42px;top:346px;background:var(--g);color:#fff;border-radius:7px;padding:9px 18px 10px;font-size:15px;font-weight:700;display:flex;gap:12px;align-items:center;box-shadow:0 4px 10px rgba(81,162,68,.28)}
</style></head><body>
<img class="abs prod" src="assets/banner_products_520x295.png">
<img class="abs logo" src="assets/logo_dark_105x30.png">
<div class="abs h1">დიდი ფასდაკლებები</div>
<div class="abs sub">ყველაფერი შენი სახლისთვის ერთ სივრცეში</div>
<div class="abs rule"></div>
<div class="abs cats"><span>ტექნიკა</span><i></i><span>ავეჯი</span><i></i><span>სამზარეულო</span><i></i><span>დეკორი</span></div>
<div class="abs deal"><span class="w">ფასდაკლება</span><span class="bar"></span><span class="n">-50%</span><span class="m">-მდე</span></div>
<div class="abs btn">ნახე შეთავაზებები <span>→</span></div>
</body></html>
