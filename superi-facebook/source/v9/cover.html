<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
/* Client-approved AI banner (its garbled text removed) + clean Georgian type and the client's logo. Native 960x540. */
:root{--g:#5DA925;--gt:#46961A;--k:#1B1E1C;--mid:#4A4F4C}
body{background:url(assets/bg_960x540.png) 0 0/960px 540px no-repeat}
.logo{left:80px;top:102px}
.h1{left:80px;top:160px;font-size:24px;font-weight:800;line-height:1.24;color:var(--k);letter-spacing:-.003em}
.h1 .g{color:var(--gt)}
.pill{left:80px;top:232px;height:42px;padding:0 24px 0 18px;border-radius:21px;background:var(--g);color:#fff;display:flex;align-items:center;gap:11px;font-size:17px;font-weight:700;box-shadow:0 6px 14px rgba(70,150,26,.25)}
.pill svg{width:22px;height:22px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.feat{left:72px;top:288px;display:flex;align-items:flex-start}
.f{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;width:88px}
.f svg{width:24px;height:24px;stroke:var(--g);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.f span{font-size:12.5px;font-weight:700;line-height:1.25;color:var(--k)}
.sep{width:1.5px;height:52px;background:#D3D6D4;margin:2px 5px 0}
.url{left:80px;top:364px;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--k);letter-spacing:.01em}
.url svg{width:20px;height:20px;stroke:var(--g);stroke-width:2;fill:none}
</style></head><body>
<img class="abs logo" src="assets/logo_dark_161x46.png">
<div class="abs h1">ტექნიკისა და ელექტრონიკის<br><span class="g">ონლაინ მაღაზია</span></div>
<div class="abs pill"><svg viewBox="0 0 24 24"><path d="M2 3h3l2.6 11.2a1.5 1.5 0 0 0 1.5 1.1h8.6a1.5 1.5 0 0 0 1.4-1l2-7.3H6.2"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>შეიძინე მარტივად ონლაინ</div>
<div class="abs feat">
  <div class="f"><svg viewBox="0 0 24 24"><path d="M2 6h11v9H2z"/><path d="M13 9h4l3 3v3h-7"/><circle cx="6" cy="17" r="1.8"/><circle cx="16.5" cy="17" r="1.8"/></svg><span>სწრაფი<br>მიწოდება</span></div>
  <div class="sep"></div>
  <div class="f"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg><span>ორიგინალი<br>პროდუქტები</span></div>
  <div class="sep"></div>
  <div class="f"><svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/><path d="M19 19c0 1.5-2 2.5-5 2.5"/></svg><span>სანდო<br>მომსახურება</span></div>
</div>
<div class="abs url"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>www.superi.ge</div>
</body></html>
