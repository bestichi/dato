<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
:root{--w:1640px;--h:924px}
body{background:var(--ink)}
/* faint modular grid */
.grid{inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:82px 82px;background-position:0 -10px}
.sun{width:740px;height:740px;border-radius:50%;background:var(--lime);left:918px;top:92px}
.ring{width:740px;height:740px;border-radius:50%;border:2px solid rgba(242,243,238,.18);left:864px;top:58px}
.bar{left:96px;top:206px;width:56px;height:6px;background:var(--lime)}
.eyebrow{left:170px;top:192px;color:var(--lime);font-size:26px;font-weight:600;letter-spacing:.06em}
.word{left:90px;top:240px;color:var(--paper);font-size:148px;font-weight:800;letter-spacing:-.045em;line-height:1;display:flex;align-items:flex-start;gap:16px}
.dom{color:var(--ink);background:var(--lime);font-size:30px;font-weight:700;padding:7px 14px 6px;border-radius:8px;letter-spacing:.02em;line-height:1;margin-top:20px}
.tag{left:96px;top:420px;color:var(--paper);font-size:44px;font-weight:700;line-height:1.25;letter-spacing:-.005em;width:760px}
.tag em{font-style:normal;color:var(--lime)}
.usp{left:96px;top:572px;display:flex;color:#C9D0CA;font-size:20px;font-weight:500}
.usp div{padding:0 22px;border-left:1px solid rgba(242,243,238,.22);line-height:1.35}
.usp div:first-child{padding-left:0;border-left:0}
.usp b{display:block;color:var(--paper);font-weight:700;font-size:21px}
.pill{left:1190px;top:700px;background:var(--ink);color:var(--paper);border-radius:999px;padding:15px 30px;font-size:25px;font-weight:600;display:flex;gap:18px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--lime);display:inline-block}
.shadow{filter:drop-shadow(0 26px 30px rgba(0,0,0,.30))}
</style></head><body>
