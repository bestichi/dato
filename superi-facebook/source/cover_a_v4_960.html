<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
/* Native 960x540: Facebook serves the page cover at 960px wide, so we draw it at exactly that size. */
:root{--w:960px;--h:540px}
body{background:var(--ink)}
.sun{width:422px;height:422px;border-radius:50%;background:var(--lime);left:520px;top:56px}
.floor{left:670px;top:410px;width:281px;height:24px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(8px)}
.word{left:66px;top:140px;color:var(--paper);font-size:88px;font-weight:800;letter-spacing:-.045em;line-height:1;display:flex;align-items:flex-start;gap:9px}
.dom{color:var(--ink);background:var(--lime);font-size:21px;font-weight:700;padding:5px 8px 4px;border-radius:5px;letter-spacing:.02em;line-height:1;margin-top:11px}
.tag{left:68px;top:243px;color:var(--paper);font-size:26px;font-weight:800;line-height:1.24}
.tag em{font-style:normal;color:var(--lime)}
.p{position:absolute;filter:drop-shadow(0 14px 16px rgba(0,0,0,.38))}
</style></head><body>
<div class="abs sun"></div>
<div class="abs floor"></div>
<img class="p" src="assets/h_tv_bauhaus_960.png"     style="left:534px;top:105px">
<img class="p" src="assets/h_fridge_960.png" style="left:806px;top:117px">
<img class="p" src="assets/h_coffee_960.png" style="left:586px;top:213px">
<img class="p" src="assets/h_washer_960.png" style="left:689px;top:262px">
<div class="abs word unb">SUPERI<span class="dom">.GE</span></div>
<div class="abs tag">ყველაფერი შენი სახლისთვის<br><em>— ერთ სივრცეში</em></div>
</body></html>
