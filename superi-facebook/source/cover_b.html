<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
:root{--w:1640px;--h:924px}
body{background:var(--paper)}
.brand{left:96px;top:176px;display:flex;align-items:center;gap:14px;font-size:34px;font-weight:800;color:var(--ink);letter-spacing:-.03em}
.brand i{width:30px;height:30px;border-radius:50%;background:var(--lime);display:block}
.brand span{color:var(--deep)}
.head{left:92px;top:240px;font-size:70px;font-weight:850;line-height:1.12;color:var(--ink);letter-spacing:-.015em}
.head .l{color:var(--deep)}
.sub{left:96px;top:500px;width:600px;font-size:23px;line-height:1.45;color:#3C433E;font-weight:500}
.chips{left:96px;top:590px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.chip{background:var(--white);border:1px solid #DADDD5;border-radius:999px;padding:9px 18px;font-size:19px;font-weight:600;color:var(--ink)}
.chip b{color:var(--deep)}
.bento{left:760px;top:172px;width:812px;height:584px;display:grid;grid-template-columns:1.25fr 1fr 0.95fr;grid-template-rows:1fr 1fr;gap:16px}
.t{border-radius:28px;position:relative;overflow:hidden}
.t .lab{position:absolute;left:24px;top:20px;font-size:20px;font-weight:700;letter-spacing:.01em}
.t img{position:absolute}
.t1{grid-column:1/3;grid-row:1;background:var(--white)}
.t1 .lab{color:var(--ink)}
.t2{grid-column:3;grid-row:1/3;background:var(--lime)}
.t2 .lab{color:var(--ink)}
.t3{grid-column:1;grid-row:2;background:var(--ink)}
.t3 .lab{color:var(--paper)}
.t4{grid-column:2;grid-row:2;background:var(--deep)}
.t4 .lab{color:var(--paper)}
.web{position:absolute;right:20px;bottom:18px;background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 18px;font-size:19px;font-weight:600}
.sh{filter:drop-shadow(0 18px 22px rgba(0,0,0,.28))}
</style></head><body>
<div class="abs brand unb"><i></i><div>superi<span>.ge</span></div></div>
<div class="abs head">ტექნიკა.<br>სახლი.<br><span class="l">კომფორტი.</span></div>
<div class="abs sub">ავეჯი, სამზარეულო და ყველაფერი სახლისთვის<br>ერთ სივრცეში — საუკეთესო ფასად.</div>
<div class="abs chips">
  <div class="chip">🚚 უფასო მიწოდება თბილისში — <b>100₾-ზე მეტზე</b></div>
</div>
<div class="abs bento">
  <div class="t t1"><div class="lab">ტელევიზორები</div><img class="sh" src="assets/c_tv2.webp" style="width:280px;left:96px;top:66px"><img class="sh" src="assets/c_phone.webp" style="height:160px;left:410px;top:92px"></div>
  <div class="t t2"><div class="lab">ყავის აპარატები</div><img class="sh" src="assets/coffee.webp" style="height:280px;left:50%;transform:translateX(-50%);top:150px"><div class="web">032 2 04 44 44</div></div>
  <div class="t t3"><div class="lab">ნოუთბუქები</div><img class="sh" src="assets/c_laptop.webp" style="width:250px;left:22px;top:70px"></div>
  <div class="t t4"><div class="lab">ავეჯი</div><img class="sh" src="assets/c_chair.webp" style="width:190px;left:26px;top:58px"></div>
</div>
</body></html>
